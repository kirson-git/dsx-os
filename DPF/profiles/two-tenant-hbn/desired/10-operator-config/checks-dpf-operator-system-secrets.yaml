apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: dpf-install-checks-secrets
  namespace: dpf-operator-system
  annotations:
    argocd.argoproj.io/sync-wave: '60'
rules:
- apiGroups:
  - ''
  resources:
  - secrets
  resourceNames:
  - bmc-shared-password
  verbs:
  - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: dpf-install-checks-secrets
  namespace: dpf-operator-system
  annotations:
    argocd.argoproj.io/sync-wave: '60'
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: dpf-install-checks-secrets
subjects:
- kind: ServiceAccount
  name: dpf-install-checks
  namespace: dpf-operator-system
