apiVersion: svc.dpu.nvidia.com/v1alpha1
kind: DPUServiceInterface
metadata:
  name: europe-p1
  namespace: dpf-operator-system
  annotations:
    argocd.argoproj.io/sync-wave: '80'
spec:
  dpuClusterSelector:
    matchLabels:
      training.dpf.nvidia.com/tenant: europe
  template:
    spec:
      template:
        metadata:
          labels:
            interface: p1
            training.dpf.nvidia.com/tenant: europe
        spec:
          interfaceType: physical
          physical:
            interfaceName: p1
