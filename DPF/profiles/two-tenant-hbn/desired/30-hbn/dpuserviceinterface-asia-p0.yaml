apiVersion: svc.dpu.nvidia.com/v1alpha1
kind: DPUServiceInterface
metadata:
  name: asia-p0
  namespace: dpf-operator-system
  annotations:
    argocd.argoproj.io/sync-wave: '80'
spec:
  dpuClusterSelector:
    matchLabels:
      training.dpf.nvidia.com/tenant: asia
  template:
    spec:
      template:
        metadata:
          labels:
            interface: p0
            training.dpf.nvidia.com/tenant: asia
        spec:
          interfaceType: physical
          physical:
            interfaceName: p0
