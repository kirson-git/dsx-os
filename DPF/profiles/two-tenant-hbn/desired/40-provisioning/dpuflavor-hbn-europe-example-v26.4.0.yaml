apiVersion: provisioning.dpu.nvidia.com/v1alpha1
kind: DPUFlavor
metadata:
  name: hbn-europe-example-v26.4.0
  namespace: dpf-operator-system
  annotations:
    argocd.argoproj.io/sync-wave: '90'
spec:
  bfcfgParameters:
  - UPDATE_ATF_UEFI=yes
  - UPDATE_DPU_OS=yes
  - WITH_NIC_FW_UPDATE=yes
  configFiles:
  - operation: override
    path: /etc/mellanox/mlnx-bf.conf
    permissions: '0644'
    raw: 'ALLOW_SHARED_RQ="no"

      IPSEC_FULL_OFFLOAD="no"

      ENABLE_ESWITCH_MULTIPORT="yes"

      '
  - operation: override
    path: /etc/mellanox/mlnx-ovs.conf
    permissions: '0644'
    raw: 'CREATE_OVS_BRIDGES="no"

      OVS_DOCA="yes"

      '
  - operation: override
    path: /etc/mellanox/mlnx-sf.conf
    permissions: '0644'
    raw: ''
  - operation: override
    path: /etc/netplan/60-europe-lab-dns.yaml
    permissions: '0600'
    raw: "network:\n  version: 2\n  ethernets:\n    oob_net0:\n      nameservers:\n\
      \        addresses: [192.0.2.53, 198.51.100.53, 203.0.113.53]\n"
  - operation: override
    path: /etc/systemd/system/dpu-agent.service.d/10-time-sync.conf
    permissions: '0644'
    raw: '[Unit]

      Requires=ntpsec.service

      After=ntpsec.service


      [Service]

      ExecStartPre=/usr/sbin/ntpwait -n 90 -s 2 -v

      TimeoutStartSec=240

      '
  containerdConfig: {}
  dpuMode: zero-trust
  grub:
    kernelParameters:
    - console=hvc0
    - console=ttyAMA0
    - earlycon=pl011,0x13010000
    - fixrttc
    - net.ifnames=0
    - biosdevname=0
    - iommu.passthrough=1
    - cgroup_no_v1=net_prio,net_cls
    - hugepagesz=2048kB
    - hugepages=3072
  nvconfig:
  - device: '*'
    parameters:
    - PF_BAR2_ENABLE=0
    - PER_PF_NUM_SF=1
    - PF_TOTAL_SF=20
    - PF_SF_BAR_SIZE=10
    - NUM_PF_MSIX_VALID=0
    - PF_NUM_PF_MSIX_VALID=1
    - PF_NUM_PF_MSIX=228
    - INTERNAL_CPU_MODEL=1
    - INTERNAL_CPU_OFFLOAD_ENGINE=0
    - SRIOV_EN=1
    - NUM_OF_VFS=46
    - LAG_RESOURCE_ALLOCATION=1
    - LINK_TYPE_P1=ETH
    - LINK_TYPE_P2=ETH
  ovs:
    rawConfigScript: "_ovs-vsctl() {\n  ovs-vsctl --timeout 15 \"$@\"\n}\n\n# Remove\
      \ default OVS configuration on the DPU and ensure no leftovers on the OVS kernel\
      \ side\n_ovs-vsctl --if-exists del-br ovsbr1\n_ovs-vsctl --if-exists del-br\
      \ ovsbr2\novs-appctl --timeout 15 dpctl/del-dp system@ovs-system || true\n\n\
      _ovs-vsctl set Open_vSwitch . other_config:doca-init=true\n_ovs-vsctl set Open_vSwitch\
      \ . other_config:dpdk-max-memzones=50000\n_ovs-vsctl set Open_vSwitch . other_config:hw-offload=true\n\
      _ovs-vsctl set Open_vSwitch . other_config:pmd-quiet-idle=true\n_ovs-vsctl set\
      \ Open_vSwitch . other_config:max-idle=20000\n_ovs-vsctl set Open_vSwitch .\
      \ other_config:max-revalidator=5000\n_ovs-vsctl set Open_vSwitch . other_config:doca-congestion-threshold=60\n\
      _ovs-vsctl set Open_vSwitch . other_config:flow-limit=500000\n_ovs-vsctl set\
      \ Open_vSwitch . other_config:hw-offload-ct-unidir-udp-enabled=true\n_ovs-vsctl\
      \ remove Open_vSwitch . other_config default-datapath-type || true\n\nif systemctl\
      \ list-unit-files openvswitch-switch.service &>/dev/null; then\n  systemctl\
      \ restart openvswitch-switch\nelif systemctl list-unit-files openvswitch.service\
      \ &>/dev/null; then\n  systemctl restart openvswitch\nfi\n_ovs-vsctl --may-exist\
      \ add-br br-sfc\n_ovs-vsctl set bridge br-sfc datapath_type=netdev\n_ovs-vsctl\
      \ set bridge br-sfc fail_mode=secure\n_ovs-vsctl --may-exist add-port br-sfc\
      \ p0\n_ovs-vsctl set Interface p0 type=dpdk\n_ovs-vsctl set Interface p0 mtu_request=9216\n\
      _ovs-vsctl set Port p0 external_ids:dpf-type=physical\n"
  sysctl: {}
