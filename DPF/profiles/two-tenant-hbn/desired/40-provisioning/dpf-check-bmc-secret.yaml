apiVersion: batch/v1
kind: Job
metadata:
  name: dpf-check-bmc-secret
  namespace: dpf-operator-system
  annotations:
    argocd.argoproj.io/sync-wave: '85'
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 1300
  template:
    spec:
      serviceAccountName: dpf-install-checks
      restartPolicy: Never
      tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
      - key: node-role.kubernetes.io/master
        operator: Exists
        effect: NoSchedule
      containers:
      - name: check
        image: clastix/kubectl:v1.34
        command:
        - /bin/sh
        - -ec
        - "ready=$(kubectl get secret bmc-shared-password -n dpf-operator-system -o\
          \ go-template='{{if .data.password}}ready{{end}}')\nif [ \"$ready\" != ready\
          \ ]; then\n  echo 'The private BMC password Secret is missing or empty;\
          \ see CREDENTIALS.md.' >&2\n  exit 1\nfi\necho 'BMC password Secret is present.\
          \ Authentication has not been tested.'\n"
