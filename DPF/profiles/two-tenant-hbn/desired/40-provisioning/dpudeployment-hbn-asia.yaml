apiVersion: svc.dpu.nvidia.com/v1alpha1
kind: DPUDeployment
metadata:
  name: hbn-asia
  namespace: dpf-operator-system
  annotations:
    argocd.argoproj.io/sync-wave: '92'
spec:
  dpus:
    bfb: bf-bundle-v26.4.0
    dpuSetStrategy:
      type: OnDelete
    dpuSets:
    - dpuClusterSelector:
        training.dpf.nvidia.com/tenant: asia
      dpuDeviceSelector:
        matchLabels:
          provisioning.dpu.nvidia.com/dpudevice-bmc-ip: 192.0.2.149
          provisioning.dpu.nvidia.com/dpunode-name: dpu-node-example-asia
      dpuNodeSelector:
        matchLabels:
          feature.node.kubernetes.io/dpu-enabled: 'true'
          training.dpf.nvidia.com/selected: 'true'
          training.dpf.nvidia.com/tenant: asia
      nameSuffix: asia
    flavor: hbn-asia-example-v26.4.0
    nodeEffect:
      force: false
      hold: true
  revisionHistoryLimit: 10
  serviceChains:
    switches:
    - ports:
      - serviceInterface:
          matchLabels:
            interface: p0
      - service:
          interface: p0_if
          name: doca-hbn
      serviceMTU: 1500
    - ports:
      - serviceInterface:
          matchLabels:
            interface: p1
      - service:
          interface: p1_if
          name: doca-hbn
      serviceMTU: 1500
    - ports:
      - serviceInterface:
          matchLabels:
            interface: pf0hpf
      - service:
          interface: pf0hpf_if
          name: doca-hbn
      serviceMTU: 1500
    upgradePolicy:
      applyNodeEffect: true
  services:
    doca-hbn:
      serviceConfiguration: doca-hbn-asia
      serviceTemplate: doca-hbn-asia
