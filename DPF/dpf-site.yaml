# Edit values marked "please change here". Lab settings are prefilled; no passwords.
# Platform first, then sync dpf-operator-config, then dpf-tenants (see README.md).
# VIPs are manual, outside DHCP. DPU management/BMC addresses use external DHCP.
# Lab DHCP: l-ae-1137d (192.168.0.1), /etc/nico-lab-dhcp.conf; not installed here.
# This file configures operator/tenants only; HBN and hardware provisioning follow.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata: {name: dpf-operator-config, namespace: argocd, labels: {customer.dpf.nvidia.com/package: dpf-platform-v26.4.0}}
spec:
  project: default
  source:
    repoURL: https://github.com/kirson-git/dsx-os.git
    targetRevision: main
    path: DPF/profiles/two-tenant-hbn/desired/10-operator-config
    kustomize:
      patches:
      - target: {kind: DPFOperatorConfig, name: dpfoperatorconfig}
        patch: |
          - op: replace
            path: /spec/overrides/kubernetesAPIServerVIP
            value: 10.220.175.20  # please change here: management Kubernetes API IP
          - op: replace
            path: /spec/overrides/kubernetesAPIServerPort
            value: 6443  # please change here: management Kubernetes API port
  destination: {name: in-cluster, namespace: dpf-operator-system}
  syncPolicy:
    syncOptions:
    - ServerSideApply=true
    - ClientSideApplyMigration=false
    - FailOnSharedResource=true
    retry: {limit: 5, backoff: {duration: 10s, factor: 2, maxDuration: 3m}}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata: {name: dpf-tenants, namespace: argocd, labels: {customer.dpf.nvidia.com/package: dpf-platform-v26.4.0}}
spec:
  project: default
  source:
    repoURL: https://github.com/kirson-git/dsx-os.git
    targetRevision: main
    path: DPF/profiles/two-tenant-hbn/desired/20-tenants
    kustomize:
      patches:
      - target: {kind: DPUCluster, name: tenant-europe}
        patch: |
          - op: replace
            path: /spec/clusterEndpoint/keepalived/vip
            value: 192.168.0.200  # please change here: Europe VIP, manual, outside DHCP
          - op: replace
            path: /spec/clusterEndpoint/keepalived/interface
            value: enp7s0  # please change here: management-node interface carrying the VIP
      - target: {kind: DPUCluster, name: tenant-asia}
        patch: |
          - op: replace
            path: /spec/clusterEndpoint/keepalived/vip
            value: 192.168.0.203  # please change here: Asia VIP, manual, outside DHCP
          - op: replace
            path: /spec/clusterEndpoint/keepalived/interface
            value: enp7s0  # please change here: management-node interface carrying the VIP
  destination: {name: in-cluster, namespace: dpf-operator-system}
  syncPolicy:
    syncOptions:
    - ServerSideApply=true
    - ClientSideApplyMigration=false
    - FailOnSharedResource=true
    retry: {limit: 5, backoff: {duration: 10s, factor: 2, maxDuration: 3m}}
