{{- if eq (index .Values "install-dhcp") "yes" -}}
{{- $config := include "dpf.dhcpConfig" . -}}
apiVersion: v1
kind: Namespace
metadata:
  name: dpf-network-system
  annotations: {argocd.argoproj.io/sync-wave: "-30"}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: dpf-dhcp
  namespace: dpf-network-system
  annotations: {argocd.argoproj.io/sync-wave: "-20"}
data:
  dnsmasq.conf: |
{{ $config | indent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dpf-dhcp
  namespace: dpf-network-system
  annotations: {argocd.argoproj.io/sync-wave: "-10"}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app.kubernetes.io/name: dpf-dhcp}
  template:
    metadata:
      labels: {app.kubernetes.io/name: dpf-dhcp}
      annotations:
        checksum/config: {{ $config | sha256sum | quote }}
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/hostname: {{ .Values.dhcp.nodeName | quote }}
      tolerations:
      - {key: node-role.kubernetes.io/control-plane, operator: Exists, effect: NoSchedule}
      securityContext:
        seccompProfile: {type: RuntimeDefault}
      initContainers:
      - name: check-interface
        image: busybox:1.37.0@sha256:bdf57e528e45e4433820e045b29b4597825a1c9e38353532d90a01445013f82e
        command: [sh, -ec]
        args:
        - |
          ip -4 -o addr show dev "$DHCP_INTERFACE" | awk '{print $4}' | cut -d/ -f1 | grep -Fx "$DHCP_SERVER_IP" || {
            echo "Assign $DHCP_SERVER_IP to $DHCP_INTERFACE on this node before enabling DHCP" >&2
            exit 1
          }
        env:
        - {name: DHCP_INTERFACE, value: {{ .Values.dhcp.interface | quote }}}
        - {name: DHCP_SERVER_IP, value: {{ .Values.dhcp.serverIP | quote }}}
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities: {drop: [ALL]}
        resources:
          requests: {cpu: 10m, memory: 16Mi}
          limits: {cpu: 100m, memory: 32Mi}
      containers:
      - name: dnsmasq
        image: registry.k8s.io/dns/k8s-dns-dnsmasq-nanny:1.26.0@sha256:6ff5a6c3f305bd3f55a79f487af3868c646c65337840a950d7928aba7007cb70
        command: [/usr/sbin/dnsmasq]
        args: [--keep-in-foreground, --conf-file=/etc/dpf-dhcp/dnsmasq.conf]
        ports:
        - {name: dhcp, containerPort: 67, hostPort: 67, protocol: UDP}
        securityContext:
          runAsUser: 0
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities: {drop: [ALL], add: [NET_ADMIN, NET_RAW, NET_BIND_SERVICE, SETGID]}
        readinessProbe:
          exec:
            command: [/usr/sbin/dnsmasq, --test, --conf-file=/etc/dpf-dhcp/dnsmasq.conf]
          initialDelaySeconds: 2
          periodSeconds: 10
        resources:
          requests: {cpu: 20m, memory: 32Mi}
          limits: {cpu: 200m, memory: 64Mi}
        volumeMounts:
        - {name: config, mountPath: /etc/dpf-dhcp, readOnly: true}
        - {name: leases, mountPath: /run/dhcp}
      volumes:
      - name: config
        configMap: {name: dpf-dhcp}
      - name: leases
        emptyDir: {}
{{- end }}
