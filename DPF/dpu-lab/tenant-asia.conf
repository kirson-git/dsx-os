# EXAMPLE VALUES. Every line marked "please change here" must get the value of YOUR site.
# This is one more tenant (Asia in our example): a second DPU with its own DPU cluster,
# VRF and addresses. Copy this file for every further tenant.
#
# Every value must differ from the other tenants, except OPN when the cards are the same
# model, and VIP_IF and DNS, which are usually the same.
#
# Where the values come from (run from the DPF folder):
#   bash dpu-lab/get-values.sh --bmc <DPU BMC>        -> SERIAL, OPN (read from the DPU BMC)
#   bash dpu-lab/get-values.sh --switch <user@switch> -> VRF, L3VNI, ASN, the ports of the DPU
#   You choose, with the network team: VIP, VRID, HOST_NET, LOOPBACK
#
# Then create the YAML files of this tenant (written to dpu-lab/tenant-asia/):
#   bash dpu-lab/new-tenant.sh dpu-lab/tenant-asia.conf
#
# To keep real addresses out of Git, copy this file to dpu-lab/site/ first (Git ignores that
# folder) and run the script on the copy. The YAML is then written to dpu-lab/site/tenant-asia/.

NAME=asia                  # please change here: short tenant name, lower case
VIP_IF=enp7s0              # please change here: interface on the management nodes that carries the VIP
DNS=203.0.113.53, 203.0.113.54, 203.0.113.55   # please change here: DNS servers the DPU uses
VIP=192.0.2.203            # please change here: free address for this DPU cluster API, outside DHCP
VRID=127                   # please change here: VRRP router id, unique on that network (1 to 255)
DPU_BMC=192.0.2.249        # please change here: address of the BMC of this DPU
SERIAL=MT0000000002        # please change here: serial number of this DPU
OPN=900-9D3B4-00CV-EA0     # please change here: part number of this DPU
VRF=ASIA                   # please change here: same name as the VRF on the switch
L3VNI=100002               # please change here: same number as the VNI of that VRF on the switch
ASN=65201                  # please change here: must equal remote-as of the switch peer group for this DPU
HOST_NET=10.60.127.0/29    # please change here: address block between this server and its DPU
LOOPBACK=10.60.124.35/32   # please change here: DPU loopback; the switch prefix list must permit it
