# EXAMPLE VALUES. Every line marked "please change here" must get the value of YOUR site.
# This is the first tenant (Europe in our example). Its YAML files are the numbered folders
# 1-dpf-settings to 4-dpu-install, and its objects carry the name "lab".
#
# Where the values come from (run from the DPF folder):
#   bash dpu-lab/get-values.sh                        -> API_IP, API_PORT, node names
#   bash dpu-lab/get-values.sh --bmc <DPU BMC>        -> SERIAL, OPN (read from the DPU BMC)
#   bash dpu-lab/get-values.sh --switch <user@switch> -> VRF, L3VNI, ASN, the ports of the DPU
#   You choose, with the network team: VIP, VRID, HOST_NET, LOOPBACK
#
# Then write the values into the YAML files:
#   bash dpu-lab/new-tenant.sh dpu-lab/tenant-europe.conf --force
#
# To keep real addresses out of Git, copy this file to dpu-lab/site/ first (Git ignores that
# folder) and run the script on the copy. The YAML is then written to dpu-lab/site/.

NAME=lab                   # keep "lab": the objects of the first tenant use this name
API_IP=198.51.100.20       # please change here: address of the existing management Kubernetes API
API_PORT=6443              # please change here: port of that API
VIP_IF=enp7s0              # please change here: interface on the management nodes that carries the VIP
DNS=203.0.113.53, 203.0.113.54, 203.0.113.55   # please change here: DNS servers the DPU uses
VIP=192.0.2.200            # please change here: free address for this DPU cluster API, outside DHCP
VRID=126                   # please change here: VRRP router id, unique on that network (1 to 255)
DPU_BMC=192.0.2.246        # please change here: address of the BMC of this DPU
SERIAL=MT0000000001        # please change here: serial number of this DPU
OPN=900-9D3B4-00CV-EA0     # please change here: part number of this DPU
VRF=EUROPE                 # please change here: same name as the VRF on the switch
L3VNI=100001               # please change here: same number as the VNI of that VRF on the switch
ASN=65101                  # please change here: must equal remote-as of the switch peer group for this DPU
HOST_NET=10.60.126.0/29    # please change here: address block between this server and its DPU
LOOPBACK=10.60.124.34/32   # please change here: DPU loopback; the switch prefix list must permit it
