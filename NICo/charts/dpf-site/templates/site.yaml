apiVersion: operator.dpu.nvidia.com/v1alpha1
kind: DPFOperatorConfig
metadata:
  name: dpfoperatorconfig
  namespace: dpf-operator-system
spec:
  dpuDetector: {disable: true}
  provisioningController:
    osInstallTimeout: 90m
    installInterface:
      installViaRedfish: {skipDPUNodeDiscovery: true}
  overrides:
    kubernetesAPIServerVIP: {{ required "dpf.apiServerIP is required" .Values.dpf.apiServerIP | quote }}
    kubernetesAPIServerPort: {{ .Values.dpf.apiServerPort }}
    argoCDNamespace: dpf-operator-system
  kamajiClusterManager: {disable: false}
  networking: {highSpeedMTU: 9000}
---
apiVersion: provisioning.dpu.nvidia.com/v1alpha1
kind: DPUCluster
metadata:
  name: carbide-dpf-cluster
  namespace: dpf-operator-system
spec:
  type: kamaji
  maxNodes: 1000
  clusterEndpoint:
    keepalived:
      interface: {{ required "dpf.interface is required" .Values.dpf.interface | quote }}
      vip: {{ required "dpf.dpuVIP is required" .Values.dpf.dpuVIP | quote }}
      virtualRouterID: {{ .Values.dpf.virtualRouterID }}
      nodeSelector:
        node-role.kubernetes.io/control-plane: {{ .Values.dpf.controlPlaneLabelValue | quote }}
{{ if .Values.metallb.install }}
---
apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: nico-services
  namespace: metallb-system
spec:
  autoAssign: false
  addresses:
{{ toYaml .Values.metallb.addresses | indent 4 }}
---
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  name: nico-services
  namespace: metallb-system
spec:
  ipAddressPools: [nico-services]
{{ end }}
