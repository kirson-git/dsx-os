apiVersion: v1
kind: Namespace
metadata:
  name: vault
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: site-root
  namespace: cert-manager
  annotations:
    argocd.argoproj.io/sync-wave: '-9'
    argocd.argoproj.io/sync-options: Delete=false,Prune=false
spec:
  isCA: true
  commonName: site-root
  secretName: site-root
  duration: 87600h
  issuerRef:
    name: selfsigned-bootstrap
    kind: ClusterIssuer
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: selfsigned-bootstrap
  annotations:
    argocd.argoproj.io/sync-wave: '-10'
    argocd.argoproj.io/sync-options: Delete=false,Prune=false
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: nicoca-vault-client
  namespace: vault
  annotations:
    argocd.argoproj.io/sync-wave: '-4'
    argocd.argoproj.io/sync-options: Delete=false,Prune=false
spec:
  secretName: nicoca-vault-client
  duration: 720h0m0s
  renewBefore: 360h0m0s
  privateKey:
    algorithm: ECDSA
    size: 384
  dnsNames:
  - vault
  - vault.vault
  - vault.vault.svc
  - vault.vault.svc.cluster.local
  - vault-0.vault-internal
  - vault-1.vault-internal
  - vault-2.vault-internal
  issuerRef:
    name: site-issuer
    kind: ClusterIssuer
    group: cert-manager.io
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: vault-raft-tls
  namespace: vault
  annotations:
    argocd.argoproj.io/sync-wave: '-4'
    argocd.argoproj.io/sync-options: Delete=false,Prune=false
spec:
  secretName: vault-raft-tls
  duration: 720h0m0s
  renewBefore: 360h0m0s
  privateKey:
    algorithm: ECDSA
    size: 384
  dnsNames:
  - vault-0.vault-internal
  - vault-1.vault-internal
  - vault-2.vault-internal
  issuerRef:
    name: site-issuer
    kind: ClusterIssuer
    group: cert-manager.io
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: site-issuer
  annotations:
    argocd.argoproj.io/sync-wave: '-5'
    argocd.argoproj.io/sync-options: Delete=false,Prune=false
spec:
  ca:
    secretName: site-root
