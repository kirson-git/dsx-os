applicationSet:
  replicas: 0
dex:
  enabled: false
notifications:
  enabled: false
global:
  podLabels:
    ovn.dpu.nvidia.com/skip-injection: ''
  affinity:
    nodeAffinity:
      type: hard
      matchExpressions:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
  tolerations:
  - key: node-role.kubernetes.io/master
    operator: Exists
    effect: NoSchedule
  - key: node-role.kubernetes.io/control-plane
    operator: Exists
    effect: NoSchedule
redis:
  image:
    repository: mirror.gcr.io/redis
configs:
  params:
    application.namespaces: dpf-operator-system
  cm:
    installationID: nico-dpf-services
    application.resourceTrackingMethod: annotation
crds:
  install: false
